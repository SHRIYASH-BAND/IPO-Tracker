name: IPO notifier

on:
  workflow_dispatch:
  schedule:
    # 03:15 UTC = 08:45 IST
    - cron: "15 3 * * *"

permissions:
  contents: read

concurrency:
  group: ipo-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch IPO data and notify Telegram
        env:
          IPO_ALERTS_API_URL: ${{ secrets.IPO_ALERTS_API_URL }}
          IPO_ALERTS_API_KEY: ${{ secrets.IPO_ALERTS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          UPSTOX_API_URL: ${{ secrets.UPSTOX_API_URL }}
          UPSTOX_ANALYTICS_API_KEY: ${{ secrets.UPSTOX_ANALYTICS_API_KEY }}
        run: python app.py